syntax = "proto3";

//python -m grpc_tools.protoc -I../protos --python_out=. --grpc_python_out=. ../protos/ris.proto

//protoc -I=./protos protos/ris.proto --js_out=import_style=commonjs:./frontend --grpc-web_out=import_style=commonjs,mode=grpcwebtext:./frontend
package ris_simulations;

service RISService {
  rpc InitializeSession (EmptyParameters) returns (InitializeSessionReturn);
  rpc LoadScene (LoadSceneParameters) returns (SuccessResponse);
  rpc CreateRIS (NewRISParameters) returns (SuccessResponse);
  rpc EditRIS (EditRISParameters) returns (SuccessResponse);
  rpc DeleteObject (DeleteObjectParameters) returns (SuccessResponse);
  rpc ConfigurePlanarArrays (ConfigurePlanarArraysParameters) returns (SuccessResponse);
  rpc CreateRadioObject(NewRadioObjectParameters) returns (SuccessResponse);
  rpc EditRadioObject(EditRadioObjectParameters) returns (SuccessResponse);
  rpc UpdatePosition(UpdatePositionParameters) returns (SuccessResponse);
  rpc ComputeRayTracing (RayTracingParameters) returns (RayTracingResponse);
  rpc ComputeCoverageMap (CoverageMapParameters) returns (CoverageMapResponse);
  rpc SaveSession(SaveSessionParameters) returns (SaveSessionResponse);
  rpc LoadSession(LoadSessionParameters) returns (LoadSessionResponse);
}

message EmptyParameters {
}

message InitializeSessionReturn {
  string session_id = 1;
}

message LoadSceneParameters {
  string session_id = 1;
  string path       = 2;
  float  frequency  = 3;
}

message Vector {
  float X = 1;
  float Y = 2;
  float Z = 3;
}

enum RISMode {
  NONE           = 0;
  PHASE_GRADIENT = 1;
  FOCUSING_LENS  = 2;
}

enum LookAtMode {
  MODE_ORIENTATION = 0;
  MODE_POSITION    = 1;
  MODE_OBJECT      = 2;
}

message NewRISParameters {
  string name = 1;

  Vector          position         = 2;
  Vector          orientation      = 3;
  int32           width            = 4;
  int32           numRows          = 5;
  int32           numCols          = 6;
  string          session_id       = 7;
  int32           num_modes        = 8;
  RISMode         mode             = 9;
  repeated string source_names     = 10;
  repeated string target_names     = 11;
  LookAtMode      look_at_mode     = 12;
  Vector          look_at_position = 13;
  string          look_at_name     = 14;
}

message EditRISParameters {
  string oldName = 1;
  string newName = 2;

  Vector          position         = 3;
  Vector          orientation      = 4;
  int32           width            = 5;
  int32           numRows          = 6;
  int32           numCols          = 7;
  string          session_id       = 8;
  int32           num_modes        = 9;
  RISMode         mode             = 10;
  repeated string source_names     = 11;
  repeated string target_names     = 12;
  LookAtMode      look_at_mode     = 13;
  Vector          look_at_position = 14;
  string          look_at_name     = 15;
}

message DeleteObjectParameters {
  string session_id = 1;
  string name       = 2;
}

enum RadioObjectType {
  TRANSMITTER = 0;
  RECEIVER    = 1;
}

message ConfigurePlanarArraysParameters{
  string          session_id        = 1;
  RadioObjectType type              = 2;
  int32           numRows           = 3;
  int32           numCols           = 4;
  float           verticalSpacing   = 5;
  float           horizontalSpacing = 6;
  string          pattern           = 7;
  string          polarization      = 8 ;
}

message NewRadioObjectParameters {
  string          session_id       = 1;
  RadioObjectType type             = 2;
  string          name             = 3;
  Vector          position         = 4;
  LookAtMode      look_at_mode     = 5;
  Vector          orientation      = 6;
  Vector          look_at_position = 7;
  string          look_at_name     = 8;
}

message EditRadioObjectParameters {
  string          session_id       = 1;
  RadioObjectType type             = 2;
  string          oldName          = 3;
  string          newName          = 4;
  Vector          position         = 5;
  LookAtMode      look_at_mode     = 6;
  Vector          orientation      = 7;
  Vector          look_at_position = 8;
  string          look_at_name     = 9;
}

message SuccessResponse {
  bool   success = 1;
  string message = 2;
}

message UpdatePositionParameters {
  string session_id = 1;
  string name       = 2;
  Vector position   = 3;
}

message RayPath {
  repeated Vector points = 1; // Lista de vértices 3D por los que pasa el rayo
}

message RayTracingParameters {
  string session_id       = 1;
  int32  max_depth        = 2;
  string method           = 3;
  int32  num_samples      = 4;
  bool   los              = 5;
  bool   reflection       = 6;
  bool   diffraction      = 7;
  bool   scattering       = 8;
  bool   ris              = 9;
  bool   edge_diffraction = 10;
}

message RayTracingResponse {
  bool             success = 1;
  string           message = 2;
  repeated RayPath paths   = 3; // Lista de todos los rayos calculados
}

message CoverageMapParameters {
  string session_id       = 1;
  int32  max_depth        = 2;
  int32  num_samples      = 3;
  bool   los              = 4;
  bool   reflection       = 5;
  bool   diffraction      = 6;
  bool   scattering       = 7;
  bool   ris              = 8;
  bool   edge_diffraction = 9;

  repeated float cm_center          = 10;
  repeated float cm_size            = 11;
  repeated float cm_orientation     = 12;
  repeated float cm_cell_size       = 13;
  int32          num_runs           = 14;
  float          vmin               = 15;
  float          vmax               = 16;
  bool           show_ris           = 17;
  bool           show_rx            = 18;
  bool           show_coverage_gain = 19;
}

message CoverageMapResponse {
  bool   success                    = 1;
  string message                    = 2;
  string coverage_map_base64        = 3;
  string coverage_map_no_ris_base64 = 4;
  string coverage_gain_base64       = 5;
}

message SaveSessionParameters {
  string session_id = 1;
}

message SaveSessionResponse {
  bool   success   = 1;
  string message   = 2;
  string json_data = 3;
}

message LoadSessionParameters {
  string session_id = 1;
  string json_data  = 2;
}

message LoadSessionResponse {
  bool   success   = 1;
  string message   = 2;
  string json_data = 3;
}
