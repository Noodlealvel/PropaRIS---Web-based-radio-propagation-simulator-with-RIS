services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - app-network

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge